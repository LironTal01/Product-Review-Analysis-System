# Local stack: PRAS API + Redis + RedisInsight.
# Usage:
#   cp .env.example .env          # then add the two API keys
#   docker compose up --build
#   docker compose down -v        # stop and remove local cache volumes
#
# App:          http://localhost:8000
# API docs:     http://localhost:8000/docs
# RedisInsight: http://localhost:5540

services:
  app:
    build: .
    image: pras-api:latest
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-5-nano}
      SCRAPER_API_KEY: ${SCRAPER_API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-pras-local}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-pras-local}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-pras-local}' ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  redisinsight_data:
